[platformio]
src_dir = .

[env:teensy40]
platform = teensy@5.2.0
platform_packages = framework-arduinoteensy@1.162.0
board = teensy40
framework = arduino
upload_protocol = teensy-cli   ; <--- ADD THIS LINE

[env:teensy40_diag]
extends = env:teensy40
build_flags = -DUSB_DUAL_SERIAL
extra_scripts = pre:scripts/diag_usb_build.py
